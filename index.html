<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanse</title>
  <meta name="theme-color" content="#1e1e2e">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #2a2a3e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 22px;
      color: #a8b8ff;
      margin-bottom: 24px;
      text-align: center;
    }
    .toggle {
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #3a3a5e;
    }
    .toggle button {
      flex: 1;
      padding: 12px;
      border: none;
      background: #2a2a3e;
      color: #aaa;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .toggle button.active-wydatek {
      background: #c0392b;
      color: white;
    }
    .toggle button.active-wplyw {
      background: #27ae60;
      color: white;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
      font-weight: 500;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #3a3a5e;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      background: #1e1e2e;
      color: #e0e0e0;
    }
    select:focus, input:focus { border-color: #a8b8ff; }
    select option { background: #2a2a3e; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #a8b8ff;
      color: #1e1e2e;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:active { background: #7a8fd4; }
    .btn:disabled { background: #444; color: #888; }
    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
    }
    .status.ok { color: #27ae60; }
    .status.err { color: #c0392b; }
  </style>
</head>
<body>
<div class="card">
  <h1>💰 Finanse</h1>

  <div class="toggle">
    <button id="btnWydatek" class="active-wydatek" onclick="setTyp('wydatek')">Wydatek</button>
    <button id="btnWplyw" onclick="setTyp('wplyw')">Wpływ</button>
  </div>

  <div class="field">
    <label>Kategoria</label>
    <select id="kategoria">
      <option value="">Ładowanie kategorii...</option>
    </select>
  </div>

  <div class="field">
    <label>Kwota (zł)</label>
    <input type="number" id="kwota" placeholder="0.00" step="0.01" min="0">
  </div>

  <div class="field">
    <label>Komentarz (opcjonalnie)</label>
    <input type="text" id="komentarz" placeholder="np. Biedronka">
  </div>

  <button class="btn" id="btnDodaj" onclick="dodaj()">Dodaj</button>
  <div class="status" id="status"></div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyJr4IyKNl82LpvkhEoUpQNouxhM0J5WRACLkPohPjH8GYkn7zBrzewA93I57nQCebLDQ/exec';
  let typ = 'wydatek';

  function setTyp(t) {
    typ = t;
    document.getElementById('btnWydatek').className = t === 'wydatek' ? 'active-wydatek' : '';
    document.getElementById('btnWplyw').className = t === 'wplyw' ? 'active-wplyw' : '';
  }

  function loadCategories() {
    const script = document.createElement('script');
    window.categoriesCallback = function(data) {
      const sel = document.getElementById('kategoria');
      sel.innerHTML = '<option value="">Wybierz kategorię...</option>';
      data.categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    };
    script.src = API_URL + '?action=getCategories&callback=categoriesCallback';
    document.head.appendChild(script);
  }

 function dodaj() {
    const kwota = document.getElementById('kwota').value;
    const kategoria = document.getElementById('kategoria').value;
    const komentarz = document.getElementById('komentarz').value;
    const status = document.getElementById('status');

    if (!kategoria) { status.className = 'status err'; status.textContent = 'Wybierz kategorię!'; return; }
    if (!kwota || kwota <= 0) { status.className = 'status err'; status.textContent = 'Wpisz kwotę!'; return; }

    document.getElementById('btnDodaj').disabled = true;
    status.className = 'status'; status.textContent = 'Zapisywanie...';

    const callbackName = 'addCallback_' + Date.now();
    window[callbackName] = function(data) {
      if (data.status === 'success') {
        status.className = 'status ok';
        status.textContent = '✓ Zapisano!';
        document.getElementById('kwota').value = '';
        document.getElementById('komentarz').value = '';
        document.getElementById('kategoria').value = '';
      } else {
        status.className = 'status err';
        status.textContent = 'Błąd zapisu!';
      }
      document.getElementById('btnDodaj').disabled = false;
      delete window[callbackName];
    };

    const params = new URLSearchParams({
      action: 'addTransaction',
      date: new Date().toLocaleString('pl-PL'),
      type: typ,
      category: kategoria,
      amount: parseFloat(kwota),
      comment: komentarz,
      callback: callbackName
    });

    const script = document.createElement('script');
    script.src = API_URL + '?' + params.toString();
    script.onerror = function() {
      status.className = 'status err';
      status.textContent = 'Błąd połączenia!';
      document.getElementById('btnDodaj').disabled = false;
    };
    document.head.appendChild(script);
  }

  loadCategories();
</script>
</body>
</html>
